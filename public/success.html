<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <link rel="stylesheet" href="./css/styles.css">
    <style>
        .success-container {
            text-align: center;
            margin-top: 50px;
        }
        .success-message {
            font-size: 24px;
            color: #28a745;
        }
        .done-btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .done-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <h1 class="success-message">Payment Successful!</h1>
        <p>Thank you for your payment. Your transaction has been processed successfully.</p>
        <button class="done-btn" onclick="window.location.href='/'">Done</button>
    </div>
</body>
</html>
